version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: trainstation
      POSTGRES_USER: trainuser
      POSTGRES_PASSWORD: trainpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn train_station_service.wsgi:application
             --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/vol/web/static
      - media_volume:/vol/web/media
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://trainuser:trainpass@db:5432/trainstation
      - SECRET_KEY=dev-secret-key-change-in-production
      - DEBUG=1
    depends_on:
      - db

volumes:
  postgres_data:
  static_volume:
  media_volume:
